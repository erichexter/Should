name: CI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore
      run: dotnet restore src/Should.sln

    - name: Build
      run: dotnet build src/Should.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test src/Should.sln --configuration Release --no-build --logger "trx;LogFileName=results.trx"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: '**/*.trx'

    - name: Pack
      if: startsWith(github.ref, 'refs/tags/v')
      run: dotnet pack src/Should.sln --configuration Release --no-build --output nupkgs

    - name: Push to NuGet
      if: startsWith(github.ref, 'refs/tags/v')
      run: dotnet nuget push nupkgs/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
